name: Deploy 🏗️

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      commit:
        required: false
        type: string
      comment:
        required: false
        type: boolean
      artifact_name:
        required: false
        type: string
        default: page
      is_prerelease:
        required: true
        type: boolean
    # Optional so this works whether they are defined as repository or environment secrets:
    # - Repository secrets: passed by the caller workflow.
    # - Environment secrets: the caller can't read them (it has no 'environment:'), so it passes
    #   an empty value, but the cf-pages job declares an environment and GitHub uses its secrets
    #   instead of the ones passed by the caller.
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions: {}

env:
  CF_PROJECT_NAME: caise27

jobs:
  cf-pages:
    name: Cloudflare Pages 📃
    runs-on: ubuntu-latest
    permissions: {}
    environment: 
      name: ${{ inputs.branch == 'main' && 'Production (Cloudflare Pages)' || 'Preview (Cloudflare Pages)' }}
      url: ${{ steps.cf.outputs.deployment-url }}
    outputs:
      url: ${{ steps.cf.outputs.deployment-url }}

    steps:
      - name: Download workflow artifact ⬇️
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      # The site is static. The artifact may come from untrusted pull request code, so never
      # deploy Cloudflare Pages Functions (server-side code that runs in Cloudflare with the project's bindings)
      - name: Remove potential server-side code
        run: rm -rf dist/_worker.js dist/_routes.json

      - name: Publish to Cloudflare Pages 📃
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        id: cf
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PROJECT_NAME }} --branch=${{ inputs.branch }}

  github-pages:
    name: GitHub Pages 📃
    runs-on: ubuntu-latest
    if: ${{ !inputs.is_prerelease }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: 
      name: ${{ inputs.branch == 'main' && 'Production (GitHub Pages)' || 'Preview (GitHub Pages)' }}
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Download workflow artifact ⬇️
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      - name: Upload GitHub Pages artifact ⬆️
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages 🚀
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Remove unnecessary artifacts 🗑️
        if: ${{ always() }}
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: github-pages

  compose-comment:
    name: Compose and push comment 📝
    # Always run so the comment is composed for the workflow summary
    if: ${{ always() }}
    uses: ./.github/workflows/__job_messages.yml
    permissions: 
      pull-requests: write
    needs:
      - cf-pages

    with:
      branch: ${{ inputs.branch }}
      commit: ${{ inputs.commit }}
      preview_url: ${{ needs.cf-pages.outputs.url }}
      in_progress: false
      comment: ${{ inputs.comment }}
