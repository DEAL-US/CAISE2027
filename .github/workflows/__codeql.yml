name: GitHub CodeQL 🔬

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string

jobs:
  analyze:
    name: Analyze ${{ matrix.language }} 🔬
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript

    steps:
      - name: Checkout repository ⬇️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
          # Safe because no repository code is executed in this workflow (see build-mode below)
          allow-unsafe-pr-checkout: true

      - name: Initialize CodeQL 🛠️
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          queries: security-and-quality
          languages: ${{ matrix.language }}
          # SECURITY: this workflow analyzes untrusted code from fork pull requests with a token
          # that can write security events. 'none' guarantees no build (and therefore no
          # repository code) is ever executed. Don't add languages that need to be built.
          build-mode: none

      - name: Perform CodeQL Analysis 🧪
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: '/language:${{matrix.language}}'
          # 'pull_request_target' runs with the base branch ref: upload the results to the
          # pull request instead, so they never affect the alerts of the default branch.
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}
          sha: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
