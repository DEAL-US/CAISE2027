name: GitHub CodeQL 🔬

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string

jobs:
  analyze:
    name: Analyze ${{ matrix.language }} 🔬
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript

    steps:
      - name: Checkout repository ⬇️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          ref: ${{ inputs.commit || github.sha }}

      - name: Initialize CodeQL 🛠️
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          queries: security-and-quality
          languages: ${{ matrix.language }}

      - name: Setup node environment ⚙️
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true

      - name: Autobuild 📦
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

      - name: Perform CodeQL Analysis 🧪
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: '/language:${{matrix.language}}'
